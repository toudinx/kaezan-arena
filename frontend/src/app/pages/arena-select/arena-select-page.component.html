<div class="arena-select">
  <header class="arena-select__header">
    <button type="button" class="header-back" (click)="goBack()">
      <svg class="header-back__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Home
    </button>
    <span class="header-title">
      Arena <span class="header-title__sep">//</span> <strong>Select Mode</strong>
    </span>
  </header>

  <div class="arena-select__body">
    <p class="arena-select__eyebrow">Choose arena type</p>

    <div class="mode-grid">
      <button type="button" class="mode-card mode-card--standard" (click)="goStandard()">
        <div class="mode-card__glow" aria-hidden="true"></div>
        <div class="mode-card__inner">
          <span class="mode-card__badge">Standard</span>
          <p class="mode-card__name">Zone Run</p>
          <p class="mode-card__description">Progress through zones 1–5. Unlock harder zones as your Account Level grows. Earn Sigils, XP, and Echo Fragments.</p>
          <span class="mode-card__cta">Enter</span>
        </div>
      </button>

      <button type="button" class="mode-card mode-card--elemental" (click)="goElemental()">
        <div class="mode-card__glow" aria-hidden="true"></div>
        <div class="mode-card__inner">
          <span class="mode-card__badge">Elemental</span>
          <p class="mode-card__name">Elemental Arenas</p>
          <p class="mode-card__description">Four permanent arenas with forced element. Primary source of Elemental Cores and Dust for weapon enchantment.</p>
          <span class="mode-card__cta">Select Arena</span>
        </div>
      </button>
    </div>
  </div>
</div>
